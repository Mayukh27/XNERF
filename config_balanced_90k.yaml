seed: 1337
data:
  root: data
  full_manifest: data/processed/manifest_balanced_90k.jsonl
  train_manifest: data/processed/train_manifest_balanced_90k.jsonl
  val_manifest: data/processed/val_manifest_balanced_90k.jsonl
  test_manifest: data/processed/test_manifest_balanced_90k.jsonl

model:
  num_classes: 2
  num_families: 64

training:
  batch_size: 32
  lr: 0.0001
  epochs: 5
  grad_accum: 1
  num_workers: 2
  checkpoint_dir: checkpoints_balanced_90k
  patience: 2
  use_amp: false
  debug_max_batches: 50

local_inference:
  checkpoint: models/best.pt